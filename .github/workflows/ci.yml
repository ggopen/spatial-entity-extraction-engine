name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Permissions required for the tests + coverage upload (no Pages here).
permissions:
  contents: read

jobs:
  test:
    name: Test & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --no-file-parallelism

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  benchmark:
    name: Scaling benchmark (synthetic 150k tris)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run scaling benchmark
        env:
          SEEE_BENCH: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx vitest run tests/benchmark.test.ts --no-file-parallelism
