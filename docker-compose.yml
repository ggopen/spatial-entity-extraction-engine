# docker-compose.yml — runs the SEEE viewer container locally.
#
#   docker compose up --build
#
# Then open http://localhost:8080/ in a browser.

services:
  seee-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: seee/viewer:latest
    container_name: seee-viewer
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
